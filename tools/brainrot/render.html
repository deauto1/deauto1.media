<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<style>
@font-face{font-family:Cairo;font-weight:700;src:url(node_modules/@fontsource/cairo/files/cairo-arabic-700-normal.woff2) format("woff2"),url(node_modules/@fontsource/cairo/files/cairo-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:Cairo;font-weight:900;src:url(node_modules/@fontsource/cairo/files/cairo-arabic-900-normal.woff2) format("woff2")}
@font-face{font-family:CairoL;font-weight:900;src:url(node_modules/@fontsource/cairo/files/cairo-latin-900-normal.woff2) format("woff2")}
@font-face{font-family:Bebas;src:url(node_modules/@fontsource/bebas-neue/files/bebas-neue-latin-400-normal.woff2) format("woff2")}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#0b0b0b;font-family:Cairo,CairoL,sans-serif;color:#fff}
#top{position:absolute;inset:0 0 auto 0;height:1100px}
#head{position:absolute;top:150px;left:60px;right:60px;display:flex;justify-content:space-between;align-items:center}
#tag{background:#e5322d;color:#fff;font-weight:900;font-size:50px;padding:6px 36px 12px;border-radius:999px}
#brand{font-family:Bebas;font-size:54px;letter-spacing:3px;color:#fff;direction:ltr}
#brand b{font-family:Cairo;font-weight:700;font-size:38px;color:#9a9a9a;margin-left:18px;letter-spacing:0;display:inline-block}
#hero{position:absolute;top:260px;left:50px;right:50px;height:390px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
#hero .sub{font-size:46px;font-weight:700;color:#a6a6a6;margin-bottom:4px}
.code{direction:ltr;font-family:Bebas;line-height:.95;white-space:nowrap}
.code span{display:inline-block;color:#fff}
.code span.hi{color:#e5322d}
.quote{font-weight:900;line-height:1.25;padding:0 10px}
.quote .who{display:block;font-size:50px;color:#a6a6a6;font-weight:700}
.quote .q{display:inline;background:linear-gradient(transparent 62%,#e5322d 62%,#e5322d 92%,transparent 92%)}
.lamp{direction:ltr;font-family:Bebas;font-size:120px;letter-spacing:6px;color:#e5322d;border:12px solid #e5322d;border-radius:36px;padding:18px 54px 6px;line-height:1}
#stamp{position:absolute;top:232px;left:44px;z-index:5;font-size:80px !important;font-weight:900;font-size:96px;color:#e5322d;border:12px solid #e5322d;border-radius:22px;padding:0 34px 12px;background:#0b0b0bee;transform-origin:center}
#card{position:absolute;top:668px;left:60px;right:60px;min-height:230px;border-radius:40px;background:#fff;color:#0b0b0b;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:900;font-size:68px;line-height:1.25;padding:22px 40px 30px}
#card.strong{background:#e5322d;color:#fff}
#card.cta{background:#fff;color:#0b0b0b;flex-direction:column;top:300px;min-height:600px;font-size:76px}
#card.cta .p{font-family:Bebas;font-size:330px;line-height:.85;color:#e5322d;direction:ltr;margin-top:14px}
#card.cta .p small{font-family:Cairo;font-weight:900;font-size:96px;margin-left:16px}
#card.cta .l{font-size:58px;background:#0b0b0b;color:#fff;border-radius:999px;padding:2px 44px 12px;margin-top:6px}
#cap{position:absolute;top:928px;left:20px;right:20px;height:150px;display:flex;align-items:center;justify-content:center;gap:22px;font-weight:900;font-size:92px;white-space:nowrap}
#cap span{color:#fff;-webkit-text-stroke:16px #0b0b0b;paint-order:stroke fill;display:inline-block}
#cap span.on{color:#e5322d}
#bar{position:absolute;top:1096px;right:0;height:8px;background:#e5322d}
#barbg{position:absolute;top:1096px;left:0;right:0;height:8px;background:#2a2a2a}
.vs{display:flex;align-items:center;justify-content:center;gap:26px;width:100%}
.vs .o,.opts .o{flex:1;background:#1d1d1d;border:8px solid #3a3a3a;border-radius:36px;font-weight:900;font-size:84px;line-height:1.15;padding:46px 14px 58px}
.vs .x{font-family:Bebas;font-size:120px;color:#e5322d;direction:ltr}
.o.on{background:#e5322d;border-color:#e5322d}.o.off{opacity:.3}
.qt{font-weight:900;font-size:74px;line-height:1.2;margin-bottom:22px}
.opts{display:flex;gap:22px;width:100%}.opts .o{font-size:50px;padding:18px 12px 28px}
#count{position:absolute;top:640px;left:0;right:0;text-align:center;font-family:Bebas;font-size:330px;line-height:1;color:#e5322d;direction:ltr}
canvas{position:absolute;left:0;top:1104px}
body.t-light{background:#f4f4f2;color:#0b0b0b}
.t-light #brand{color:#0b0b0b}.t-light .code span{color:#0b0b0b}.t-light .code span.hi{color:#e5322d}
.t-light #card{background:#0b0b0b;color:#fff}.t-light #card.strong{background:#e5322d}.t-light #card.cta{background:#0b0b0b;color:#fff}.t-light #card.cta .l{background:#fff;color:#0b0b0b}
.t-light #cap span{color:#0b0b0b;-webkit-text-stroke:16px #f4f4f2}.t-light #cap span.on{color:#e5322d}
.t-light #stamp{background:#f4f4f2ee}.t-light #barbg{background:#d0d0d0}
.t-light .vs .o,.t-light .opts .o{background:#fff;border-color:#c9c9c9}.t-light .o.on{background:#e5322d;border-color:#e5322d;color:#fff}
.t-light #hero .sub,.t-light .quote .who{color:#6b6b6b}
body.t-red{background:#e5322d}
.t-red #tag{background:#0b0b0b}.t-red #brand b{color:#ffd0ce}.t-red #hero .sub,.t-red .quote .who{color:#ffd0ce}
.t-red .code span.hi{color:#0b0b0b}.t-red .quote .q{background:linear-gradient(transparent 62%,#0b0b0b 62%,#0b0b0b 92%,transparent 92%)}
.t-red #card.strong{background:#0b0b0b}.t-red #cap span.on{color:#0b0b0b;-webkit-text-stroke:16px #fff}
.t-red #stamp{color:#fff;border-color:#fff;background:#0b0b0bee}.t-red #bar{background:#0b0b0b}.t-red #barbg{background:#b01f1b}
.t-red .vs .x,.t-red #count{color:#0b0b0b}.t-red .vs .o,.t-red .opts .o{background:#b01f1b;border-color:#f08a86}.t-red .o.on{background:#0b0b0b;border-color:#0b0b0b}
.t-red .lamp{color:#fff;border-color:#fff}
</style></head><body>
<div id="top"><div id="head"><div id="tag"></div><div id="brand">DE.AUTO<b>دي اوتو</b></div></div>
<div id="hero"></div><div id="stamp" style="display:none"></div><div id="card" style="display:none"></div><div id="count" style="display:none"></div><div id="cap"></div></div>
<div id="barbg"></div><div id="bar"></div><canvas id="cv" width="1080" height="816"></canvas>
<script src="sim.js"></script><script src="sims2.js"></script>
<script>
const $ = s => document.querySelector(s);
let V, TM, T, sim, simT = 0, cx;
const pop = x => { x = Math.max(0, Math.min(1, x)); const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
window.__init = (v, tm, total, seed) => {
  V = v; TM = tm; T = total; sim = new SIMS[v.sim || "rings"](seed, 8); document.body.className = "t-" + (v.theme2 || "dark"); cx = $("#cv").getContext("2d");
  $("#tag").textContent = v.tag; const h = v.hero, H = $("#hero");
  if (h.kind === "code") { const n = h.parts.join("").length; const fs = h.small ? 104 : n <= 5 ? 330 : n <= 7 ? 270 : 210;
    H.innerHTML = `<div class="sub">${h.sub || ""}</div><div class="code" style="font-size:${fs}px;${h.spaced ? "letter-spacing:26px" : ""}">` + h.parts.map((p, i) => `<span data-i="${i}">${p === " " ? "&nbsp;" : p}</span>`).join("") + "</div>"; }
  else if (h.kind === "quote") { const fs = h.text.length > 30 ? 82 : h.text.length > 20 ? 100 : 124;
    H.innerHTML = `<div class="quote" style="font-size:${fs}px"><span class="who">${v.tag}:</span><span class="q">«${h.text}»</span></div>`; }
  else if (h.kind === "icon") H.innerHTML = `<div class="sub" style="margin-bottom:26px">${h.sub}</div><div class="lamp">CHECK ENGINE</div>`;
  else if (h.kind === "versus") H.innerHTML = `<div class="vs"><div class="o" data-o="0">${h.a}</div><div class="x">VS</div><div class="o" data-o="1">${h.b}</div></div>`;
  else if (h.kind === "text") H.innerHTML = `<div class="qt">${h.text}</div><div class="opts">${h.opts.map((o, i) => `<div class="o" data-o="${i}">${o}</div>`).join("")}</div>`;
  return document.fonts.ready.then(() => true);
};
const PAL = { dark: { bg: "#141414", fg: "#ffffff", acc: "#e5322d", dim: "#5c5c5c" }, light: { bg: "#e9e9e6", fg: "#0b0b0b", acc: "#e5322d", dim: "#a9a9a9" }, red: { bg: "#c42622", fg: "#ffffff", acc: "#0b0b0b", dim: "#f08a86" } };
function drawSim(t) { while (simT < t) { sim.step(1 / 120); simT += 1 / 120; } const P = PAL[V.theme2 || "dark"]; cx.fillStyle = P.bg; cx.fillRect(0, 0, 1080, 816); sim.draw(cx, t, P); }
window.__frame = t => {
  drawSim(t);
  $("#bar").style.width = Math.min(100, (t / T) * 100) + "%";
  // current beat
  let bi = 0; for (let i = 0; i < TM.beats.length; i++) if (t >= TM.beats[i]) bi = i;
  const b = V.beats[bi], age = t - TM.beats[bi], card = $("#card"), hero = $("#hero");
  document.querySelectorAll(".code span").forEach(s => s.classList.toggle("hi", !!(b.hi && b.hi.includes(+s.dataset.i))));
  const lamp = $(".lamp"); if (lamp) lamp.style.opacity = b.blink ? (Math.floor(t * 5) % 2 ? 0.15 : 1) : 1;
  const k = pop(age / 0.28);
  if (b.cta) { card.style.display = "flex"; card.className = "cta"; card.innerHTML = `<div>بطاقات مصطلحات الورش</div><div class="p">10<small>ريال</small></div><div class="l">الرابط في البايو</div>`; hero.style.opacity = 0; $("#stamp").style.display = "none"; card.style.transform = `scale(${0.5 + 0.5 * k})`; }
  else { hero.style.opacity = 1; card.className = b.strong ? "strong" : "";
    if (b.show) { card.style.display = "flex"; card.textContent = b.show; card.style.transform = `scale(${0.55 + 0.45 * k}) rotate(${(1 - Math.min(1, age / 0.28)) * -3}deg)`; } else card.style.display = "none"; }
  // stamp stays once shown
  let st = null, stT = 0; for (let i = 0; i <= bi; i++) if (V.beats[i].stamp) { st = V.beats[i].stamp; stT = TM.beats[i]; }
  const S = $("#stamp"); if (st && !b.cta) { S.style.display = "block"; S.textContent = st; const a = Math.min(1, (t - stT) / 0.22); S.style.transform = `rotate(-12deg) scale(${3 - 2 * pop(a) })`; S.style.opacity = a; } else S.style.display = "none";
  let sel = null; for (let i = 0; i <= bi; i++) { if (V.beats[i].answer != null) sel = V.beats[i].answer; } if (b.side != null) sel = b.side; if (V.hero.kind === "versus" && b.side == null) sel = null;
  document.querySelectorAll(".o").forEach(o => { o.classList.toggle("on", sel === +o.dataset.o); o.classList.toggle("off", sel != null && sel !== +o.dataset.o); });
  const C = $("#count"); if (b.count) { const nb = TM.beats[bi + 1] ?? T, n = 3 - Math.min(2, Math.floor(age / ((nb - TM.beats[bi]) / 3))); const la = age % ((nb - TM.beats[bi]) / 3); C.style.display = "block"; C.textContent = n; C.style.transform = `scale(${0.7 + 0.3 * pop(la / 0.2)})`; } else C.style.display = "none";
  // hero punch on beat change
  hero.style.transform = `scale(${1 + 0.06 * Math.max(0, 1 - age / 0.2)})`;
  // captions
  const cap = $("#cap"); const ch = TM.chunks.find(c => t >= c.s && t < c.e);
  if (!ch) cap.innerHTML = ""; else { cap.innerHTML = ch.w.map(w => `<span class="${t >= w.s ? "on" : ""}" style="transform:scale(${t >= w.s ? 1 + 0.12 * Math.max(0, 1 - (t - w.s) / 0.15) : 1})">${w.t}</span>`).join("");
    const tot = cap.scrollWidth; if (tot > 1040) cap.style.fontSize = Math.floor(92 * 1040 / tot) + "px"; else cap.style.fontSize = "92px"; }
};
</script></body></html>
