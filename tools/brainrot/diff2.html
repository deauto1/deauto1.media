let c; function setup() { c = $("#cv").getContext("2d"); }
const RD = "#e5322d", WH = "#f2f2f2", GY = "#5c5c5c";
function lampIcon(k, x, y, col) { c.save(); c.translate(x, y); c.fillStyle = c.strokeStyle = col; c.lineWidth = 9; c.lineCap = "round"; c.lineJoin = "round";

  if (k === "eng") { c.beginPath(); c.moveTo(-50, -20); c.lineTo(-20, -20); c.lineTo(-20, -34); c.lineTo(20, -34); c.lineTo(20, -20); c.lineTo(46, -20); c.lineTo(46, 30); c.lineTo(-50, 30); c.closePath(); c.stroke(); }
  if (k === "belt") { c.beginPath(); c.arc(0, -30, 13, 0, 7); c.fill(); c.beginPath(); c.moveTo(-26, 40); c.lineTo(-20, -10); c.lineTo(20, -10); c.lineTo(26, 40); c.stroke(); c.beginPath(); c.moveTo(-22, -6); c.lineTo(22, 30); c.stroke(); }

  c.fillStyle = WH; c.font = "190px Bebas"; c.textAlign = "center"; c.fillText(v ? "225/40R17" : "225/45R17", 540, y0 + 270); c.font = "80px Bebas"; c.fillStyle = "#9a9a9a"; c.fillText("DOT  " + (v ? "2342" : "2324"), 360, y0 + 400);
  c.strokeStyle = WH; c.lineWidth = 12; c.lineCap = "round"; c.beginPath(); const d = v ? -1 : 1; c.moveTo(760 - d * 90, y0 + 375); c.lineTo(760 + d * 90, y0 + 375); c.lineTo(760 + d * 55, y0 + 345); c.moveTo(760 + d * 90, y0 + 375); c.lineTo(760 + d * 55, y0 + 405); c.stroke(); c.font = "40px Bebas"; c.fillStyle = "#9a9a9a"; c.fillText("ROTATION", 760, y0 + 330); },

  c.fillStyle = WH; c.beginPath(); c.moveTo(130, y0 + 330); c.lineTo(130, y0 + 250); c.lineTo(280, y0 + 230); c.lineTo(400, y0 + 140); c.lineTo(700, y0 + 140); c.lineTo(820, y0 + 230); c.lineTo(950, y0 + 250); c.lineTo(950, y0 + 330); c.closePath(); c.fill();
  c.fillStyle = "#1b2230"; c.beginPath(); c.moveTo(310, y0 + 228); c.lineTo(415, y0 + 160); c.lineTo(540, y0 + 160); c.lineTo(540, y0 + 228); c.fill(); c.beginPath(); c.moveTo(560, y0 + 228); c.lineTo(560, y0 + 160); c.lineTo(690, y0 + 160); c.lineTo(790, y0 + 228); c.fill();
  if (!v) { c.fillStyle = GY; c.beginPath(); c.roundRect(300, y0 + 200, 40, 26, 8); c.fill(); } c.fillStyle = v ? WH : RD; c.fillRect(130, y0 + 262, 26, 36); c.strokeStyle = "#bbb"; c.lineWidth = 4; c.strokeRect(130, y0 + 262, 26, 36);

  for (const wx of [290, 790]) { c.fillStyle = "#0b0b0b"; c.beginPath(); c.arc(wx, y0 + 335, 72, 0, 7); c.fill(); c.fillStyle = "#9a9a9a"; c.beginPath(); c.arc(wx, y0 + 335, 40, 0, 7); c.fill(); c.strokeStyle = "#0b0b0b"; c.lineWidth = 8;
    const n = (v && wx === 790) ? 10 : 5; for (let i = 0; i < n; i++) { const a = i * Math.PI * 2 / n; c.beginPath(); c.moveTo(wx, y0 + 335); c.lineTo(wx + Math.cos(a) * 40, y0 + 335 + Math.sin(a) * 40); c.stroke(); } } } };
window.__frame = t => { const [bi, age] = beatAt(t); c.clearRect(0, 0, 1080, 1020); SC[V.scene](20, 0); SC[V.scene](530, 1);
  if (bi === 2) { const on = age < 0.9 && Math.floor(age * 8) % 2 === 0; if (on) { c.strokeStyle = RD; c.lineWidth = 12; V.circ.forEach(p => { c.beginPath(); c.arc(p[0], p[1], p[2], 0, 7); c.stroke(); }); } }
  const tm = $("#time"); if (bi === 1) { tm.style.display = ""; tm.textContent = Math.max(0, Math.ceil(TM.beats[2] - t)); } else tm.style.display = bi === 0 ? "" : "none"; if (bi === 0) tm.textContent = "10";
  show($("#end"), bi === 2 && age > 0.9, (age - 0.9) / 0.3); };
