<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><style>
#ttl{top:250px;left:40px;right:40px;text-align:center;font-weight:900;font-size:104px;line-height:1.15}#ttl b{color:#e5322d}
#cv{position:absolute;top:520px;left:0}#time{top:1560px;left:0;right:0;text-align:center;font-family:Bebas;font-size:230px;line-height:1;color:#e5322d;direction:ltr}
#end{top:1570px;left:60px;right:60px;text-align:center;font-weight:900;font-size:76px;line-height:1.25}#end b{color:#e5322d}
</style></head><body>
<div id="head"><div id="tag"></div><div id="brand">DE.AUTO<b>دي اوتو</b></div></div><div id="ttl" class="abs">أوجد <b>3</b> فروقات</div>
<canvas id="cv" width="1080" height="1020"></canvas><div id="time" class="abs"></div><div id="end" class="abs" style="display:none">فاتتك؟ <b>عيد المقطع</b><br>وكم لقيت؟ اكتب 👇</div>
<script src="common.js"></script><script>
let c; function setup() { c = $("#cv").getContext("2d"); }
function gauge(x, y, r, a, lab) { c.strokeStyle = "#f2f2f2"; c.lineWidth = 12; c.beginPath(); c.arc(x, y, r, Math.PI * 0.8, Math.PI * 2.2); c.stroke(); c.strokeStyle = "#e5322d"; c.beginPath(); c.arc(x, y, r, Math.PI * 1.95, Math.PI * 2.2); c.stroke();
  for (let i = 0; i <= 7; i++) { const A = Math.PI * (0.8 + 1.4 * i / 7); c.strokeStyle = "#8a8a8a"; c.lineWidth = 6; c.beginPath(); c.moveTo(x + Math.cos(A) * (r - 14), y + Math.sin(A) * (r - 14)); c.lineTo(x + Math.cos(A) * (r - 40), y + Math.sin(A) * (r - 40)); c.stroke(); }
  const A = Math.PI * (0.8 + 1.4 * a); c.strokeStyle = "#e5322d"; c.lineWidth = 12; c.lineCap = "round"; c.beginPath(); c.moveTo(x, y); c.lineTo(x + Math.cos(A) * (r - 50), y + Math.sin(A) * (r - 50)); c.stroke(); c.fillStyle = "#f2f2f2"; c.beginPath(); c.arc(x, y, 16, 0, 7); c.fill(); c.font = "44px Bebas"; c.textAlign = "center"; c.fillStyle = "#8a8a8a"; c.fillText(lab, x, y + r * 0.62); }
function dash(y0, v) { c.fillStyle = "#151515"; c.beginPath(); c.roundRect(40, y0, 1000, 460, 50); c.fill(); c.strokeStyle = "#2c2c2c"; c.lineWidth = 6; c.stroke();
  gauge(270, y0 + 250, 170, 0.45, "KM/H"); gauge(810, y0 + 250, 170, 0.3, "RPM");
  c.fillStyle = "#0b0b0b"; c.beginPath(); c.roundRect(470, y0 + 70, 140, 150, 24); c.fill(); c.fillStyle = "#fff"; c.font = "150px Bebas"; c.textAlign = "center"; c.fillText(v ? "N" : "D", 540, y0 + 196);
  c.strokeStyle = "#8a8a8a"; c.lineWidth = 8; c.strokeRect(460, y0 + 270, 160, 34); c.fillStyle = "#f2f2f2"; c.fillRect(464, y0 + 274, 152 * (v ? 0.25 : 0.6), 26); c.font = "34px Bebas"; c.fillStyle = "#8a8a8a"; c.fillText("E", 440, y0 + 300); c.fillText("F", 640, y0 + 300);
  [0, 1, 2].forEach(i => { c.fillStyle = (v && i === 1) ? "#e5322d" : "#333"; c.beginPath(); c.arc(480 + i * 60, y0 + 370, 20, 0, 7); c.fill(); }); }
window.__frame = t => { const [bi, age] = beatAt(t); c.clearRect(0, 0, 1080, 1020); dash(20, 0); dash(530, 1);
  if (bi === 2) { const on = age < 0.9 && Math.floor(age * 8) % 2 === 0; if (on) { c.strokeStyle = "#e5322d"; c.lineWidth = 12; [[540, 675], [540, 815], [540, 900]].forEach(p => { c.beginPath(); c.arc(p[0], p[1], p[1] === 675 ? 100 : 62, 0, 7); c.stroke(); }); } }
  const tm = $("#time"); if (bi === 1) { const left = Math.max(0, Math.ceil((TM.beats[2] - t))); tm.style.display = ""; tm.textContent = left; tm.style.transform = `scale(${1 + 0.15 * Math.max(0, 1 - ((TM.beats[2] - t) % 1 > 0.85 ? 0 : 1))})`; } else tm.style.display = bi === 0 ? "" : "none"; if (bi === 0) tm.textContent = "10";
  show($("#end"), bi === 2 && age > 0.9, (age - 0.9) / 0.3); };
</script></body></html>
