<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Cairo;font-weight:600;src:url(node_modules/@fontsource/cairo/files/cairo-arabic-600-normal.woff2)}
@font-face{font-family:Cairo;font-weight:900;src:url(node_modules/@fontsource/cairo/files/cairo-arabic-900-normal.woff2)}
@font-face{font-family:CairoL;font-weight:600;src:url(node_modules/@fontsource/cairo/files/cairo-latin-600-normal.woff2)}
@font-face{font-family:CairoL;font-weight:900;src:url(node_modules/@fontsource/cairo/files/cairo-latin-900-normal.woff2)}
@font-face{font-family:Bebas;src:url(node_modules/@fontsource/bebas-neue/files/bebas-neue-latin-400-normal.woff2)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden}
body{background:#FCFCFC;color:#111;font-family:CairoL,Cairo,sans-serif;direction:rtl;position:relative}
.top{position:absolute;top:64px;left:72px;right:72px;display:flex;justify-content:space-between;align-items:center}
.brand{display:flex;align-items:center;gap:14px;font-family:Cairo;font-weight:900;font-size:34px}
.brand img{height:54px}
.cnt{font-family:Bebas;font-size:38px;letter-spacing:3px;color:#9a988f;direction:ltr}
.bar{position:absolute;top:150px;right:72px;width:120px;height:8px;background:#e5322d;border-radius:4px}
.foot{position:absolute;bottom:64px;left:72px;right:72px;display:flex;justify-content:space-between;align-items:center;font-size:28px;color:#7a7870;font-weight:600}
.foot .en{font-family:Bebas;letter-spacing:4px;font-size:32px;direction:ltr}
.mid{position:absolute;top:200px;bottom:150px;left:72px;right:72px;display:flex;flex-direction:column;justify-content:center}
.k{font-size:44px;font-weight:900;color:#e5322d}
h1{font-family:CairoL,Cairo;font-weight:900;font-size:118px;line-height:1.15}
h2{font-family:CairoL,Cairo;font-weight:900;font-size:64px;line-height:1.3}
.term{font-family:Cairo;font-weight:900;font-size:170px;line-height:1.1}
.ten{font-family:Bebas;font-size:96px;letter-spacing:4px;color:#e5322d;direction:ltr;text-align:right;margin-top:6px}
.mean{font-weight:600;font-size:60px;line-height:1.45;margin-top:56px;max-width:900px}
.num{font-family:Bebas;font-size:300px;color:#ededea;position:absolute;left:60px;bottom:120px;line-height:1;direction:ltr}
.opt{display:flex;align-items:center;gap:28px;border:4px solid #111;border-radius:28px;padding:26px 36px;margin-top:28px;font-size:56px;font-weight:900}
.opt b{font-family:Bebas;font-size:64px;color:#e5322d;width:50px;text-align:center}
.swipe{margin-top:60px;font-size:44px;font-weight:900;display:flex;align-items:center;gap:18px}
.swipe span{display:inline-block;background:#111;color:#fff;border-radius:40px;padding:6px 34px 12px}
.pill{display:inline-block;background:#e5322d;color:#fff;font-weight:900;font-size:52px;border-radius:50px;padding:8px 44px 16px;margin-top:56px}
.sg{font-size:46px;font-weight:600;color:#55534c;margin-top:36px}
</style></head><body><div id="root"></div>
<script>
const Q=new URLSearchParams(location.search);const D=JSON.parse(Q.get('d'));const i=+Q.get('i');const N=8;
const root=document.getElementById('root');
const hdr=`<div class="top"><div class="brand"><img src="assets/logo_k.png"><span>دي اوتو</span></div><div class="cnt">${i+1} / ${N}</div></div><div class="bar"></div>`;
const foot=`<div class="foot"><span>الجزء ${D.part}: ${D.title}</span><span class="en">DE AUTO</span></div>`;
let body='';
if(i===0){body=`<div class="mid"><div class="k">من ملخّص الجزء ${D.part}</div><h1>5 كلمات<br>تكفيك</h1><h2 style="margin-top:20px">عشان تفهم «${D.title.replace('؟','')}»</h2><div class="swipe"><span>اسحب ←</span></div></div>`;}
else if(i>=1&&i<=5){const w=D.words[i-1];body=`<div class="num">${i}</div><div class="mid"><div class="term">${w[0]}</div><div class="ten">${w[1]}</div><div class="mean">${w[2]}</div></div>`;}
else if(i===6){const q=D.quiz;body=`<div class="mid"><div class="k">اختبر نفسك</div><h2 style="font-size:76px">${q[0]}</h2>${q[1].map((o,j)=>`<div class="opt"><b>${'ABC'[j]}</b>${o}</div>`).join('')}<div class="sg">اكتب جوابك في التعليقات 👇</div></div>`;}
else {body=`<div class="mid" style="align-items:flex-start"><div class="k">هذا من ملخّص Made Easier</div><h1 style="font-size:96px">والجزء ${D.part} كامل<br>يشرح لك أكثر</h1><div class="sg">بالعربي البسيط، ورسومات توضيحية · PDF</div><div class="pill">الرابط في البايو</div><div class="sg" style="margin-top:44px">ما نعلمك، إحنا نفهمك</div></div>`;}
root.innerHTML=hdr+body+foot;
document.fonts.ready.then(()=>{document.title='ready'});
</script></body></html>
